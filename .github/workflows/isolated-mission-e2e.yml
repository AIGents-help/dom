name: Isolated Mission Lifecycle E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: isolated-mission-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mission-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase stack
        run: |
          started=false
          for attempt in 1 2 3 4; do
            if supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              started=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 45))
              echo "Supabase image pull/start failed (attempt $attempt/4). Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          if [ "$started" != "true" ]; then
            echo "Supabase failed to start after four attempts."
            exit 1
          fi
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Build and start DOM
        run: |
          npm run build
          npm start > /tmp/dom-e2e.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dom-e2e.log
          exit 1
      - name: Run isolated mission lifecycle
        run: node --test e2e/authenticated-mission-flow.test.mjs
        env:
          E2E_ISOLATED_SUPABASE: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          AIRHUB_API_KEY: ""
      - name: Show application log after failure
        if: failure()
        run: cat /tmp/dom-e2e.log || true
