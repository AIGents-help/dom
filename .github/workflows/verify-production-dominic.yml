name: Verify Production DOMINIC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production to expose merged DOMINIC homepage
        shell: bash
        run: |
          set -euo pipefail
          url="https://droneopsman.com"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -qi "Intelligent Mapping by DOM"; then
              echo "DOMINIC homepage marker is live on production."
              exit 0
            fi
            echo "Attempt $attempt/30: production has not exposed the DOMINIC marker yet."
            sleep 20
          done
          echo "Production did not expose the DOMINIC homepage marker within 10 minutes."
          exit 1

      - name: Verify DOMINIC route responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/dominic.html -w '%{http_code}' --max-time 20 https://droneopsman.com/dominic)"
          test "$code" = "200"
          grep -qi "DOMINIC" /tmp/dominic.html
          echo "DOMINIC route is live and contains the product shell marker."
