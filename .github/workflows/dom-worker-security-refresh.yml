name: Refresh DOM mapper worker dependencies
on:
  push:
    branches: [security/refresh-dom-deps-20261030]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh production mapper worker dependency graph
        working-directory: services/mapper-worker
        run: |
          npm install -g npm@11
          npm pkg set overrides.qs=6.16.1
          npm install
          npm audit fix || true
          npm audit --omit=dev
      - name: Commit audited worker lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/mapper-worker/package.json services/mapper-worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh mapper worker production dependency security'
            git push
          fi
