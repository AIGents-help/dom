name: Repair remaining DOM dependency advisories
on:
  push:
    branches: [security/refresh-dom-deps-20261030]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use modern npm and repair dependency graph
        run: |
          npm install -g npm@11
          npm ci --ignore-scripts
          npm audit fix || true
          # Production packages are the deployment gate; dev advisories are handled separately.
          npm audit --omit=dev
      - name: Commit patched lockfile if clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Repair remaining audited dependency advisories'
            git push
          fi
