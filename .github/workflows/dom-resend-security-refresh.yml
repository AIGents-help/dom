name: Refresh Resend security dependency
on:
  push:
    branches: [security/refresh-dom-deps-20261030]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade Resend and regenerate lockfile
        run: |
          npm install --save resend@6.36.0
          # Audit is enforced by Verify DOM; do not allow npm's audit-fix crash to suppress the lockfile commit.
          npm audit --omit=dev || true
      - name: Commit refreshed dependency lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Resend to patched dependency chain'
            git push
          fi
