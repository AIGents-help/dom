name: Verify DJI Android Bridge

on:
  pull_request:
    paths:
      - "services/flight-bridge-dji/android/**"
      - ".github/workflows/verify-dji-android-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "services/flight-bridge-dji/android/**"
      - ".github/workflows/verify-dji-android-bridge.yml"

jobs:
  compile-dji-android-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile and test DJI Android bridge
        run: gradle -p services/flight-bridge-dji/android compileDebugKotlin testDebugUnitTest :controller-app:assembleDebug :controller-app:testDebugUnitTest --stacktrace
      - name: Upload controller diagnostic APK (no DJI key)
        uses: actions/upload-artifact@v4
        with:
          name: dominic-controller-diagnostic-no-key
          path: services/flight-bridge-dji/android/controller-app/build/outputs/apk/debug/controller-app-debug.apk
          if-no-files-found: error
          retention-days: 14
