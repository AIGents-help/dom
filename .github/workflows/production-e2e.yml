name: Production E2E Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: production-e2e
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for this commit to reach production
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for droneopsman.com to serve $GITHUB_SHA"
          for attempt in $(seq 1 36); do
            BODY=$(curl -fsS --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' "https://droneopsman.com/api/build?verify=$GITHUB_SHA&attempt=$attempt" || true)
            LIVE_SHA=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).buildId||"")}catch{}})')
            echo "attempt=$attempt live=$LIVE_SHA expected=$GITHUB_SHA"
            if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
              echo "Production is serving the commit under test."
              exit 0
            fi
            sleep 10
          done
          echo "Production never promoted $GITHUB_SHA within the deployment verification window."
          exit 1
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://droneopsman.com
