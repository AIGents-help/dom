name: Verify Production DOMINIC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production to expose merged DOMINIC homepage
        shell: bash
        run: |
          set -euo pipefail
          url="https://droneopsman.com"
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -qi "Uniquely Sophisticated." \
              && printf '%s' "$body" | grep -qi "Intelligent Mapping by DOM" \
              && printf '%s' "$body" | grep -qi "Safety-First Operations" \
              && printf '%s' "$body" | grep -qi "Same Perspective. Higher Purpose." \
              && printf '%s' "$body" | grep -qi "Map. Measure. Analyze. Deliver."; then
              echo "Updated DOM homepage and DOMINIC layout are live on production."
              exit 0
            fi
            echo "Attempt $attempt/30: production has not exposed the upgraded DOM homepage markers yet."
            sleep 20
          done
          echo "Production did not expose the upgraded DOM homepage within 10 minutes."
          exit 1

      - name: Verify approved DOMINIC mascot asset
        shell: bash
        run: |
          set -euo pipefail
          asset="https://droneopsman.com/brand/dominic-mascot.webp"
          curl -fsSL --max-time 20 "$asset" -o /tmp/dominic-mascot.webp
          bytes="$(wc -c < /tmp/dominic-mascot.webp | tr -d ' ')"
          test "$bytes" -gt 1000

          magic="$(od -An -tx1 -N12 /tmp/dominic-mascot.webp | tr -d ' \n')"
          test "${magic:0:8}" = "52494646"
          test "${magic:16:8}" = "57454250"
          echo "DOMINIC mascot WebP is live and valid ($bytes bytes)."

      - name: Verify DOMINIC route responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/dominic.html -w '%{http_code}' --max-time 20 https://droneopsman.com/dominic)"
          test "$code" = "200"
          grep -qi "DOMINIC" /tmp/dominic.html
          echo "DOMINIC route is live and contains the product shell marker."
