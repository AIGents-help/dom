name: Verify Production DOMINIC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-dominic
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the merged commit to be live
        run: node scripts/wait-for-production.mjs
        env:
          PRODUCTION_EXPECTED_SHA: ${{ github.sha }}

      - name: Verify approved homepage content
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://droneopsman.com -o /tmp/dom-homepage.html
          grep -qi "Uniquely Sophisticated." /tmp/dom-homepage.html
          grep -qi "Intelligent Mapping by DOM" /tmp/dom-homepage.html
          grep -qi "Safety-First Operations" /tmp/dom-homepage.html
          grep -qi "Same Perspective. Higher Purpose." /tmp/dom-homepage.html
          grep -qi "Map. Measure. Analyze. Deliver." /tmp/dom-homepage.html

      - name: Verify approved DOMINIC mascot asset
        shell: bash
        run: |
          set -euo pipefail
          asset="https://droneopsman.com/brand/dominic-mascot.webp"
          curl -fsSL --max-time 20 "$asset" -o /tmp/dominic-mascot.webp
          bytes="$(wc -c < /tmp/dominic-mascot.webp | tr -d ' ')"
          test "$bytes" -gt 1000

          magic="$(od -An -tx1 -N12 /tmp/dominic-mascot.webp | tr -d ' \n')"
          test "${magic:0:8}" = "52494646"
          test "${magic:16:8}" = "57454250"
          echo "DOMINIC mascot WebP is live and valid ($bytes bytes)."

      - name: Verify DOMINIC route responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/dominic.html -w '%{http_code}' --max-time 20 https://droneopsman.com/dominic)"
          test "$code" = "200"
          grep -qi "DOMINIC" /tmp/dominic.html
          echo "DOMINIC route is live and contains the product shell marker."
